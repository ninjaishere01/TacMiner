{% load static %}
<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>سجل السحوبات - TAC Miner</title>
    <link
      rel="shortcut icon"
      href="{% static 'logo-brand/one-logo.png' %}"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
  </head>
  <body>
    <!-- الهيدر -->
    <header
      class="top-header mt-3 px-3 d-flex justify-content-between align-items-center"
    >
      <div class="d-flex align-items-center gap-2">
        <a
          href="{% url 'profile' %}"
          class="text-info fs-4 text-decoration-none"
        >
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
      <div class="d-flex gap-2">
        <div
          class="icon-btn rounded-pill d-flex justify-content-center align-items-center gap-2"
        >
          <h6 class="mb-0 text-warning fw-bold" id="global-balance">1500</h6>
          <img src="{% static 'images/tac-coin.png' %}" alt="" width="25" />
        </div>
      </div>
    </header>

    <!-- المحتوى -->
    <main class="pt-5 pb-5 mb-5 mt-4 d-flex justify-content-center w-100">
      <div
        class="mine-container"
        style="width: 95%; max-width: 600px; padding: 0 10px"
      >
        <h4 class="page-header-title">
          <i class="fa-solid fa-clock-rotate-left text-info"></i> سجل السحوبات
        </h4>

        <div class="dark-info-card" id="history-container">
          <!-- سيتم عرض طلبات السحب هنا بالجافاسكريبت -->
        </div>
      </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav fixed-bottom">
      <div class="d-flex justify-content-around align-items-end pb-2 pt-1">
        <a href="{% url 'index' %}" class="nav-item text-center">
          <i class="fa-solid fa-hammer fs-5"></i><br /><small
            style="font-size: 10px"
            >الرئيسية</small
          >
        </a>
        <a href="{% url 'upgrade' %}" class="nav-item text-center">
          <i class="fa-solid fa-arrow-up-right-dots fs-5"></i><br /><small
            style="font-size: 10px"
            >تطوير</small
          >
        </a>
        <a href="{% url 'tasks' %}" class="nav-item center-btn text-center">
          <div
            class="circle-glow d-flex justify-content-center align-items-center"
          >
            <i class="fa-solid fa-list-check fs-3 text-white"></i>
          </div>
          <br /><small style="font-size: 10px" class="mt-1 d-block"
            >المهام</small
          >
        </a>
        <a href="{% url 'referral' %}" class="nav-item text-center">
          <i class="fa-solid fa-user-group fs-5"></i><br /><small
            style="font-size: 10px"
            >الإحالة</small
          >
        </a>
        <a href="{% url 'profile' %}" class="nav-item text-center">
          <i class="fa-solid fa-user fs-5"></i><br /><small
            style="font-size: 10px"
            >حسابي</small
          >
        </a>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/game.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        loadWithdrawHistory();
      });

      function loadWithdrawHistory() {
        const container = document.getElementById("history-container");

        // بنجيب الطلبات من الباك إند
        fetch(`/api/withdraw-history/?telegram_id=123456789`)
          .then((res) => res.json())
          .then((requests) => {
            // لو مفيش طلبات
            if (requests.length === 0) {
              container.innerHTML = `
                <div class="text-center text-muted mt-4 mb-4">
                  <i class="fa-solid fa-receipt fa-3x mb-3 opacity-50"></i>
                  <p>لا توجد طلبات سحب سابقة.</p>
                </div>
              `;
              return;
            }

            let html = "";
            requests.forEach((req) => {
              let statusClass = "";
              let statusIcon = "";
              let statusText = "";
              let amountClass = "";

              // تحديد الشكل حسب حالة الطلب
              if (req.status === "pending") {
                statusClass = "pending";
                statusIcon = '<i class="fa-solid fa-spinner fa-spin"></i>';
                statusText = "قيد المراجعة";
                amountClass = "pending";
              } else if (req.status === "completed") {
                statusClass = "success";
                statusIcon = '<i class="fa-solid fa-check"></i>';
                statusText = "تم الدفع";
                amountClass = "success";
              } else {
                statusClass = "failed";
                statusIcon = '<i class="fa-solid fa-xmark"></i>';
                statusText = "مرفوض";
                amountClass = "failed";
              }

              html += `
                <div class="transaction-item">
                  <div class="trx-info">
                    <div class="trx-icon ${statusClass}">${statusIcon}</div>
                    <div class="trx-details">
                      <span class="trx-title">سحب USDT - ${statusText}</span>
                      <span class="trx-date">${req.date}</span>
                    </div>
                  </div>
                  <div class="trx-amount ${amountClass}">${req.amount.toFixed(2)}</div>
                </div>
              `;
            });

            container.innerHTML = html;
          })
          .catch((err) => {
            console.error("Error fetching history:", err);
            container.innerHTML = `<p class="text-center text-danger">حدث خطأ في تحميل السجل.</p>`;
          });
      }
    </script>
    
  </body>
</html>
