{% load static %}
<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>حسابي - TAC Miner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link
      rel="shortcut icon"
      href="{% static 'logo-brand/one-logo.png' %}"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/profile.css' %}" />
    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
  </head>
  <body>
    <!-- الهيدر -->
    <header
      class="top-header mt-3 px-3 d-flex justify-content-between align-items-center"
    >
      <div class="d-flex align-items-center gap-2">
        <div class="border-info">
          <img src="{% static 'logo-brand/one-logo.png' %}" alt="" width="50" />
        </div>
      </div>
      <div class="d-flex gap-2">
        <div
          class="icon-btn rounded-pill d-flex justify-content-center align-items-center gap-2"
        >
          <h6 class="mb-0 text-warning fw-bold" id="global-balance">0.00</h6>
          <img src="{% static 'images/tac-coin.png' %}" alt="" width="25" />
        </div>
      </div>
    </header>

    <!-- المحتوى -->
    <main class="pt-5 pb-5 mb-5 mt-4 d-flex justify-content-center w-100">
      <div class="mine-container">
        <!-- 1. بيانات اللاعب -->
        <div class="text-center mb-4 mt-3">
          <div class="profile-avatar-box">
            <img src="{% static 'images/8.png' %}" alt="" width="60" />
          </div>
          <h5
            class="text-white fw-bold mb-1 d-flex justify-content-center align-items-center gap-2"
          >
            <span id="profile-username">new user</span>

            <!-- أيقونة التوثيق (تظهر لو المحفظة مربوطة) -->
            <i
              id="verified-badge"
              class="fa-solid fa-circle-check text-info d-none"
              style="font-size: 18px"
            ></i>

            <!-- شارة الشريك -->
            <span
              id="partner-badge"
              class="badge bg-warning text-dark d-none"
              style="font-size: 12px"
            >
              <i class="fa-solid fa-crown"></i> شريك
            </span>
          </h5>
        </div>

        <!-- 2. كارت المحفظة (الرصيد) -->
        <div class="wallet-card text-center mb-4">
          <h6>إجمالي رصيدك</h6>
          <div class="wallet-balance">
            <span id="profile-balance">0.00</span>
            <span style="font-size: 16px; color: #b71c1c">TAC</span>
          </div>

          <!-- توضيح سعر الصرف -->
          <div class="exchange-rate mt-2">
            <i class="fa-solid fa-arrows-rotate"></i> 920 TAC = 1 USDT
          </div>
        </div>

        <!-- كارت ربط المحفظة -->
        <div class="wallet-connect-card mb-4">
          <div class="d-flex align-items-center gap-3">
            <div class="connect-icon">
              <i class="fa-solid fa-wallet"></i>
            </div>
            <div class="flex-grow-1">
              <h6 class="mb-1 text-white fw-bold">اربط محفظتك (TON Connect)</h6>
              <p class="mb-0 text-muted small">
                اربط محفظة TON الخاصة بك لتفعيل السحب والتحقق.
              </p>
            </div>
          </div>
          <div id="ton-connect-button"></div>
        </div>

        <!-- 3. أزرار التحويل والسحب -->
        <div class="row g-3 mb-4">
          <div class="col-6">
            <a href="{% url 'exchange' %}" class="action-btn btn-exchange">
              <i class="fa-solid fa-money-bill-transfer"></i>
              تحويل العملة
            </a>
          </div>
          <div class="col-6">
            <a href="{% url 'withdraw' %}" class="action-btn btn-withdraw">
              <i class="fa-solid fa-hand-holding-dollar"></i>
              سحب USDT
            </a>
          </div>
        </div>

        <!-- 4. قائمة الإعدادات -->
        <h6 class="text-white mb-3 text-start fw-bold">الإعدادات</h6>
        <div class="settings-list text-start">
          <a href="{% url 'withdraw_history' %}" class="settings-item">
            <i class="fa-solid fa-clock-rotate-left text-info"></i>
            <span>سجل السحوبات</span>
            <i
              class="fa-solid fa-chevron-left ms-auto"
              style="font-size: 12px"
            ></i>
          </a>

          <a href="{% url 'how_to_earn' %}" class="settings-item">
            <i class="fa-solid fa-chart-line text-warning"></i>
            <span>كيف تزيد من أرباحك</span>
            <i
              class="fa-solid fa-chevron-left ms-auto"
              style="font-size: 12px"
            ></i>
          </a>

          <a href="{% url 'about' %}" class="settings-item">
            <i class="fa-solid fa-circle-info text-cyan"></i>
            <span>من نحن</span>
            <i
              class="fa-solid fa-chevron-left ms-auto"
              style="font-size: 12px"
            ></i>
          </a>
        </div>
      </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav fixed-bottom" oncontextmenu="return false;">
      <div class="d-flex justify-content-around align-items-end pb-2 pt-1">
        <a href="{% url 'index' %}" class="nav-item text-center">
          <i class="fa-solid fa-hammer fs-5"></i><br /><small
            style="font-size: 10px"
            >الرئيسية</small
          >
        </a>
        <a href="{% url 'upgrade' %}" class="nav-item text-center">
          <i class="fa-solid fa-arrow-up-right-dots fs-5"></i><br /><small
            style="font-size: 10px"
            >تطوير</small
          >
        </a>
        <a href="{% url 'tasks' %}" class="nav-item center-btn text-center">
          <div
            class="circle-glow d-flex justify-content-center align-items-center"
          >
            <i class="fa-solid fa-list-check fs-3 text-white"></i>
          </div>
          <br /><small style="font-size: 10px" class="mt-1 d-block"
            >المهام</small
          >
        </a>
        <a href="{% url 'referral' %}" class="nav-item text-center">
          <i class="fa-solid fa-user-group fs-5"></i><br /><small
            style="font-size: 10px"
            >الإحالة</small
          >
        </a>
        <a href="{% url 'profile' %}" class="nav-item text-center">
          <i class="fa-solid fa-user fs-5"></i><br /><small
            style="font-size: 10px"
            >حسابي</small
          >
        </a>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/game.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>

    <!-- سكريبت بسيط لتحديث الرصيد وعرض التنبيهات -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // بنجيب بيانات اليوزر من الباك إند
        fetch("/api/login/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telegram_id: telegramId,
            username: username,
            referral_id: referralId,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.message === "Success") {
              if (typeof updateBalanceUI === "function") {
                updateBalanceUI(data.user.balance);
              }

              const nameEl = document.getElementById("profile-username");
              if (nameEl && data.user.username) nameEl.innerText = data.user.username;

              const referralsCount = Number.isFinite(Number(data.user.referrals_count))
                ? Number(data.user.referrals_count)
                : (data.user.referrals || []).length;
              if (referralsCount >= 10) {
                const partnerBadge = document.getElementById("partner-badge");
                if (partnerBadge) partnerBadge.classList.remove("d-none");
              }

              if (data.user.is_wallet_verified) {
                const verifiedBadge = document.getElementById("verified-badge");
                if (verifiedBadge) verifiedBadge.classList.remove("d-none");
              }
            }
          })
          .catch((err) => console.log("Error fetching user data:", err));
      });

      document.addEventListener("DOMContentLoaded", () => {
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://tacminer.onrender.com/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(async (walletInfo) => {
            if (walletInfo && walletInfo.account && walletInfo.account.address) {
                const walletAddress = walletInfo.account.friendlyAddress || walletInfo.account.address;
                fetch('/api/verify-wallet/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: telegramId,
                        wallet_address: walletAddress
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.message === "Wallet Verified!") {
                        Swal.fire({ title: "تم الربط!", text: "تم ربط محفظتك بنجاح.", icon: "success" });
                        const badge = document.getElementById("verified-badge");
                        if (badge) badge.classList.remove("d-none");
                    }
                });
            }
            if (walletInfo === null) {
                // المستخدم فصل المحفظة
                const badge = document.getElementById("verified-badge");
                if (badge) badge.classList.add("d-none");

                // نبعت للباك إند إنه فصل
                fetch('/api/disconnect-wallet/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
            }
        });
      });
    </script>
  </body>
</html>
