{% load static %}

<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>التطوير - TAC Miner </title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="shortcut icon" href="../logo-brand/one-logo.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="style.css" /> -->
    <link rel="stylesheet" href="{% static 'css/upgrade.css' %}" />
    <link rel="stylesheet" href="{% static 'css/global.css' %}" />
  </head>
  <body>
    <!-- الهيدر -->
    <header
      class="top-header px-3 d-flex justify-content-between align-items-center"
    >
      <div class="d-flex mt-4  align-items-center gap-2">
        <div class="border-info">
         <img src="{% static 'logo-brand/one-logo.png' %}" alt="" width="50" />
        </div>
      </div>
      <div class="d-flex mt-4 gap-2">
        <div
          class="icon-btn rounded-pill d-flex justify-content-center align-items-center gap-2"
        >
          <h6 class="mb-0 text-warning fw-bold" id="global-balance">0.00</h6>
          <img src="{% static 'images/tac-coin.png' %}" alt="" width="25">
        </div>
      </div>
    </header>

    <!-- المحتوى -->
    <main class="pt-5 pb-5 mb-5 d-flex justify-content-center w-100">
      <div class="mine-container">
        <h4 class="text-white text-center mb-4">تطوير العمال</h4>
        <div class="row g-3" id="upgrade-container">
          <!-- كروت العمال هنا -->
        </div>
      </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav fixed-bottom" oncontextmenu="return false;">
      <div class="d-flex justify-content-around align-items-end pb-2 pt-1">
        <a href="{% url 'index' %}" class="nav-item text-center">
          <i class="fa-solid fa-hammer fs-5"></i><br /><small
            style="font-size: 10px"
            >الرئيسية</small
          >
        </a>
        <a href="{% url 'upgrade' %}" class="nav-item text-center">
          <i class="fa-solid fa-arrow-up-right-dots fs-5"></i><br /><small
            style="font-size: 10px"
            >تطوير</small
          >
        </a>
        <a href="{% url 'tasks' %}" class="nav-item center-btn text-center">
          <div
            class="circle-glow d-flex justify-content-center align-items-center"
          >
            <i class="fa-solid fa-list-check fs-3 text-white"></i>
          </div>
          <br /><small style="font-size: 10px" class="mt-1 d-block"
            >المهام</small
          >
        </a>
        <a href="{% url 'referral' %}" class="nav-item text-center">
          <i class="fa-solid fa-user-group fs-5"></i><br /><small
            style="font-size: 10px"
            >الإحالة</small
          >
        </a>
        <a href="{% url 'profile' %}" class="nav-item text-center">
          <i class="fa-solid fa-user fs-5"></i><br /><small
            style="font-size: 10px"
            >حسابي</small
          >
        </a>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/game.js' %}"></script>
    <script src="{% static 'js/index.js' %}"></script>
  </body>
</html>
